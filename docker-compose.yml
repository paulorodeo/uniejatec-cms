services:
  postgres:
    image: postgres:16-alpine
    container_name: uniejatec-cms-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cms_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-uniejatec} -d ${POSTGRES_DB:-uniejatec_cms}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  payload:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniejatec-cms
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - media_data:/app/media
    networks:
      - cms_internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/admin || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  cms_internal:
    driver: bridge

volumes:
  postgres_data:
  media_data:
